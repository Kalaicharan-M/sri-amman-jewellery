services:
  - type: web
    name: jewellery-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PORT
        value: "5000"
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://sri-amman-jewellery.vercel.app
      - key: FRONTEND_ORIGIN_REGEX
        value: ^https://.*\.vercel\.app$
      - key: SCRAPER_TIMEOUT
        value: "15"
      - key: GOLD_RATE_CACHE_TTL_MINUTES
        value: "10"
      - key: GOLD_RATE_CACHE_FILE
        value: gold_rate_cache.json
      - key: PRODUCTS_FILE
        value: products.json
      - key: UPLOAD_FOLDER
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "8"
      - key: FLASK_DEBUG
        value: "false"
