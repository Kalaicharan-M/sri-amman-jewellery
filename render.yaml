services:
  - type: web
    name: jewellery-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FRONTEND_ORIGIN
        value: http://localhost:5173
      - key: SCRAPER_TIMEOUT
        value: "15"
      - key: GOLD_RATE_CACHE_TTL_MINUTES
        value: "10"
